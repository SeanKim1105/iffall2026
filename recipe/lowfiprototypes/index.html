<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Low-Fidelity Prototype Sketches of Recipes</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 5%;
            color: #222;
        }

        h1 {
            margin-bottom: 0.25rem;
        }

        .intro {
            color: #555;
            margin-bottom: 2rem;
        }

        .set {
            margin-bottom: 3rem;
        }

        .set h2 {
            border-bottom: 2px solid #ddd;
            padding-bottom: 0.5rem;
        }

        .set p {
            color: #555;
            margin-top: 0;
        }

        .set img {
            max-width: 100%;
            height: auto;
            display: block;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-top: 1rem;
        }
        
        .rotate-left {
            transform: rotate(-180 deg);
            transform-origin: center;
        }
    </style>
</head>
<body>

    <h1>Low-Fidelity Prototype Sketches</h1>
    <p class="intro">Two sets of sketches of a laptop (landscape) view and a mobile (portrait) view of my recipe website.</p>

    <section class="set">
        <h2>Set 1</h2>
        <p>Laptop (landscape) and mobile (portrait) layouts.</p>
        <img src="IMG_8326.jpeg" alt="Set 1 sketches: laptop landscape view and mobile portrait view">
    </section>

    <section class="set">
        <h2>Set 2</h2>
        <p>Laptop (landscape) and mobile (portrait) layouts.</p>
        <img src="IMG_8327.jpeg" alt="Set 2 sketches: laptop landscape view and mobile portrait view">
    </section>

</body>
