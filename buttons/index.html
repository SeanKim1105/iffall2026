<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Button Styling — Your Name</title>
        <link href="css/styles.css" rel="stylesheet">
    </head>
    <body>
        <main>
            <h1>Button Styling — Your Name</h1>
            <div class="buttons">

                <div class="button-container">
                    <a href="http://www.harley-davidson.com/" target="_blank" rel="noopener noreferrer" class="harley-button">
                        <span class="harley-top">Harley-Davidson</span>
                        <span class="harley-bottom">Motor Company</span>
                    </a>
                </div>

                <div class="button-container">
                    <a href="https://www.lyft.com/" target="_blank" rel="noopener noreferrer" class="lyft-button">
                        <span>lyft</span>
                    </a>
                </div>

                <div class="button-container">
                    <a href="http://www.newyorker.com/" target="_blank" rel="noopener noreferrer" class="newyorker-button">
                        <span class="ny-the">The</span>
                        <span class="ny-name">New Yorker</span>
                    </a>
                </div>

                <div class="button-container">
                    <a href="http://nerf.hasbro.com/en-us" target="_blank" rel="noopener noreferrer" class="nerf-button">
                        <span>NERF</span>
                    </a>
                </div>

                <div class="button-container">
                    <a href="http://www.teslamotors.com/" target="_blank" rel="noopener noreferrer" class="tesla-button">
                        <span>Tesla</span>
                    </a>
                </div>

            </div>
        </main>
    </body>
</html>
